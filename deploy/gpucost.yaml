# gpucost as a daily report inside the cluster: a CronJob that reads Prometheus and prints the report to its log.
#
# It needs no Kubernetes API access at all, so the service account mounts no token and has no RBAC. The network
# policy lets it reach Prometheus and DNS and nothing else.
#
#   kubectl apply -f deploy/gpucost.yaml
#   kubectl -n gpucost create job --from=cronjob/gpucost gpucost-now   # run it once now
#   kubectl -n gpucost logs job/gpucost-now
#
# Before applying: set the Prometheus URL in the CronJob's args and its namespace and port in the NetworkPolicy,
# put your GPU prices in the ConfigMap, and pin the image to the release digest.
apiVersion: v1
kind: Namespace
metadata:
  name: gpucost
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpucost
  namespace: gpucost
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpucost-prices
  namespace: gpucost
data:
  # Your rates per GPU-hour. Keys are GPU models in any spelling, families (a100), instance:TYPE, or * for the rest.
  prices.csv: |
    gpu,price_per_gpu_hour,note
    h100-80gb,4.00,replace with your rate
    a100-80gb,2.50,replace with your rate
    l4,0.70,replace with your rate
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gpucost
  namespace: gpucost
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gpucost
        spec:
          serviceAccountName: gpucost
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: gpucost
              image: ghcr.io/sunilmehta-si/k8s-gpu-cost-scanner:v0.1.0
              args:
                - scan
                - --prometheus=http://prometheus-operated.monitoring.svc:9090
                - --window=24h
                - --prices=/etc/gpucost/prices.csv
                - -o=markdown
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: prices
                  mountPath: /etc/gpucost
                  readOnly: true
          volumes:
            - name: prices
              configMap:
                name: gpucost-prices
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gpucost
  namespace: gpucost
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gpucost
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
