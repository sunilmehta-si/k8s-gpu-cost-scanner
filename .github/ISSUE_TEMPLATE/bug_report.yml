name: Wrong finding or bug
description: A finding that is wrong, a number that does not add up, or gpucost failing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A wrong finding is easiest to fix with the window it came from: `gpucost record --redact`
        replaces your namespace, pod, node and model names with pseudonyms and still gives the same findings.
        For a security problem, use the Security tab's private report instead.
  - type: input
    id: version
    attributes:
      label: gpucost version
      description: The output of `gpucost version`.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The command you ran, the finding or output that is wrong, and why you think so.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: gpucost doctor output
      description: Run `gpucost doctor` against the same Prometheus and paste its output.
      render: text
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Exporters and versions
      description: kube-state-metrics, DCGM exporter, vLLM or SGLang, OpenCost; and the Prometheus-compatible server (Prometheus, Thanos, Mimir...).
  - type: textarea
    id: snapshot
    attributes:
      label: Redacted snapshot (optional)
      description: Attach the file from `gpucost record --redact -o window.json.gz` for the window in question.
