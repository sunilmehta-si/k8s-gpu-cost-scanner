name: code-review

# Reviews every pull request with agentic-code-review-tool: the changed lines of the Go code, the workflows, the
# Dockerfile and the Kubernetes manifests, as a review with inline comments and as annotations. The AI step is off,
# so no model key is needed. Pull requests from forks get a read-only token: annotations, no review comment.
on:
  pull_request:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sunilmehta-si/agentic-code-review-tool@c57d7a70e81209348c6b6870c905a585329a7d37 # v0.11.1
        with:
          fail-on: high
          ai: none
          scanners: none
          sarif-file: ""
